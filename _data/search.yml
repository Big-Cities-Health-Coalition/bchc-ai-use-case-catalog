# ---------------------------------------------------------------------------
# Search vocabulary and the catalog's browse pages.
#
# A controlled vocabulary the search box cannot see is a controlled vocabulary
# that does not exist: someone types "chatbot", the schema says "Chat assistant",
# and the catalog answers "no results" about an entry it holds. Everything here
# closes that gap. It is DATA, not code — nothing below is referenced by key in
# a template or a script.
#
# Consumers:
#   _plugins/search_index.rb   copies `synonyms` into /search.json for the
#                              query-side expansion in assets/js/search.js
#   _includes/filter-groups.html  emits `aliases` on each filter pill as
#                              data-filter-terms, which is what assets/js/search.js
#                              matches a typed query against
#   _plugins/facet_pages.rb    reads `landing`
#
# Delete this file and everything still works: no synonyms, no aliases, and
# landing pages generated for every facet field (the defaults below).
#
# ---------------------------------------------------------------------------
# synonyms   query-side only, and bidirectional: typing either side finds the
#            other. Each extra term is added to the lunr query at a lower boost
#            than the literal one, so a synonym never outranks a real hit.
#            Use it for words that are NOT in the taxonomy — a term of art, an
#            abbreviation, the word a resident would use. Keys and values are
#            matched case-insensitively.
# ---------------------------------------------------------------------------
synonyms:
  chatbot: ["chat assistant", "conversational"]
  opioid: ["overdose", "naloxone"]
  geocode: ["address matching"]
  llm: ["large language model", "generative text"]
  rag: ["retrieval augmented generation", "document q&a"]
  phi: ["health information", "hipaa"]
  pii: ["personal information", "identifiers"]
  syndromic: ["surveillance", "essence"]
  translation: ["multilingual", "language access"]
  procurement: ["contract", "purchasing", "rfp"]
  etl: ["pipeline", "data integration", "extract transform load"]
  fhir: ["interoperability", "hl7", "api"]
  elr: ["electronic lab reporting", "lab results"]
  ecr: ["electronic case reporting", "eicr"]
  dashboard: ["visualization", "power bi", "tableau"]
  gis: ["mapping", "geospatial", "arcgis"]
  warehouse: ["data platform", "lakehouse", "data lake"]
  modernization: ["dmi", "data modernization initiative"]
  rpa: ["workflow automation", "power automate"]

# ---------------------------------------------------------------------------
# aliases    <field key> -> <exact option value> -> the words a reader might
#            type for it. When a query matches one, the search box offers the
#            FILTER rather than a text hit — which is a better answer, because
#            it is exhaustive and it teaches the taxonomy.
#
#            The option value must match _data/schema.yml exactly. An option's
#            own label, its `option_meta.short` and its `option_meta.description`
#            are always matchable; only add words that are not already in them.
#
#            This lives here rather than in the schema's `option_meta` because
#            it is search tuning, not content model — but folding it into
#            `option_meta.aliases` later would be a compatible move (see
#            docs/search.md).
# ---------------------------------------------------------------------------
aliases:
  solution_type:
    "AI/ML model": ["machine learning", "ml", "risk model", "forecasting model", "predictive model"]
    "Generative AI tool": ["llm", "gpt", "chatgpt", "copilot", "chatbot", "generative"]
    "Data pipeline or integration": ["etl", "elt", "pipeline", "feed", "interface", "hl7", "fhir", "api", "interoperability"]
    "Analysis project or script": ["python", "rstudio", "shiny", "sas", "stata", "sql", "notebook", "statistical analysis"]
    "Dashboard or visualization": ["dashboard", "power bi", "tableau", "arcgis", "map", "report"]
    "Application or software": ["app", "web app", "mobile app", "portal", "software"]
    "Data platform or infrastructure": ["data warehouse", "data lake", "lakehouse", "cloud", "infrastructure as code", "terraform"]
    "Workflow automation": ["rpa", "power automate", "scheduled job", "automation"]
    "Standards, governance or playbook": ["data standard", "data governance", "policy", "playbook", "checklist", "template"]
  sharing:
    "Open-source code": ["open source", "github", "repository", "repo", "free"]
    "Code on request": ["private repo", "available on request"]
    "Templates or documentation only": ["templates", "documentation", "docs", "guide"]
    "Description only": ["write-up", "case study", "lessons learned"]
  ai_role:
    "No AI": ["non-ai", "without ai", "traditional"]
    "AI helped build it": ["ai-assisted", "coding assistant", "built with ai"]
  ai_types:
    "Chat assistant": ["chatbot", "virtual assistant", "helpdesk bot", "copilot"]
    "Generative text (LLM)": ["llm", "gpt", "generative ai", "drafting"]
    "Document Q&A (RAG)": ["rag", "ask my documents", "knowledge base"]
    "Classification & NLP": ["triage", "tagging", "text mining", "categorize"]
    "Prediction & forecasting": ["risk model", "machine learning", "forecast"]
    "Computer vision": ["ocr", "image recognition", "scanned documents"]
    "Speech & transcription": ["transcription", "voice", "audio"]
    "Translation": ["multilingual", "language access", "interpretation"]
    "Agents & automation": ["agentic", "ai agent"]
  data_sensitivity:
    "Health information (PHI)": ["hipaa", "phi", "patient data"]
    "Personal information (PII)": ["pii", "identifiers", "personally identifiable"]
    "De-identified data": ["anonymized", "deidentified"]
    "Criminal justice data (CJIS)": ["cjis", "law enforcement data"]
  area:
    "Communicable disease": ["infectious disease", "immunization", "vaccine", "sti", "hiv", "tb", "outbreak"]
    "Chronic disease and injury prevention": ["chronic disease", "overdose", "opioid", "violence prevention", "tobacco", "injury"]
    "Environmental health": ["inspections", "restaurant", "food safety", "vector", "lead", "heat"]
    "Maternal, child and family health": ["mch", "wic", "home visiting", "prenatal", "infant"]
    "Access to and linkage with care": ["clinic", "community health worker", "chw", "referral", "linkage"]
    "Emergency preparedness and response": ["emergency response", "incident", "phep", "preparedness"]
    "Epidemiology and surveillance": ["epi", "case investigation", "syndromic", "wastewater", "surveillance"]
    "Vital records and health statistics": ["birth records", "death records", "mortality", "vital statistics"]
    "Communications and community engagement": ["public information", "risk communication", "media", "outreach", "language access"]
    "Data modernization and informatics": ["informatics", "data modernization", "interoperability", "data governance", "dmi"]
    "Agency operations and administration": ["hr", "hiring", "onboarding", "finance", "grants", "procurement", "contracts", "it", "legal"]
  platform:
    "Microsoft Azure": ["azure openai", "microsoft cloud"]
    "Enterprise AI workspace": ["copilot", "chatgpt enterprise", "gemini for workspace"]
    "Low-code platform": ["power automate", "power apps", "airtable", "n8n"]
  expertise:
    "Anyone on staff": ["no code", "non technical"]
    "Analyst or data scientist": ["python", "r", "sql", "sas"]
  readiness:
    "Human review built in": ["human in the loop", "oversight", "review step"]
    "Needs a data agreement": ["dua", "baa", "data use agreement"]

# ---------------------------------------------------------------------------
# landing    the crawlable browse surface generated by _plugins/facet_pages.rb:
#            one page per facet value at /<entry.path>/<field>/<value>/, plus the
#            A–Z directory that indexes them at /<entry.path>/a-z/.
#
#   enabled     false switches the whole thing off (the A–Z page then lists
#               entries only).
#   exclude     facet field keys that should NOT get landing pages. Use it for
#               a free-text facet whose values are long-tail noise.
#   max_values  a field with more distinct values than this is skipped and
#               logged, so one accidentally free-text facet cannot multiply the
#               build by a thousand pages.
#   min_entries values carried by fewer entries than this are skipped. 1 means
#               "generate a page for every value in use". Raise it to 2 or 3 on
#               a large catalog to drop the single-entry tail.
#   max_entries how many entries one landing page lists. The rest are one click
#               away behind the "see them all" link into the live filter, and
#               this is what keeps the build time of a large catalog bounded.
#
# Every generated page costs build time: at ten entries the eleven facets below
# produce ~74 pages and add roughly half a second. Watch it as the catalog
# grows and reach for `min_entries` / `exclude` before `enabled: false`.
# ---------------------------------------------------------------------------
landing:
  enabled: true
  # Tool and technology names are free text, so this facet has one value per
  # product version ("SQL Server 2019", "Azure OpenAI GPT-4o") that nobody links
  # to, and the count grows with the catalog rather than with the taxonomy.
  exclude: ["ai_tools"]
  max_values: 200
  min_entries: 1
  max_entries: 24
